<div class="detail-page">

  <h2>🎫 Ticket Detail</h2>

  <!-- 🎫 TICKET -->
  <div *ngIf="ticket" class="ticket-box">
    <h3>{{ ticket.title }}</h3>
    <p>{{ ticket.description }}</p>

    <div class="meta">
      <span><b>Status:</b> {{ ticket.status }}</span>
      <span><b>Created By:</b> {{ ticket.createdBy?.name }}</span>
    </div>
  </div>

  <!-- 💬 COMMENTS -->
  <div class="comments-box">
    <h3>💬 Comments</h3>

    <div *ngFor="let c of comments" class="comment">
      <b>{{ c.createdBy?.name }}</b>
      <p>{{ c.message }}</p>
    </div>

    <!-- ➕ ADD COMMENT -->
    <div class="add-comment">
      <input
        [(ngModel)]="newComment"
        placeholder="Write comment..."
      />
      <button (click)="addComment()">Send</button>
    </div>
  </div>

</div>
