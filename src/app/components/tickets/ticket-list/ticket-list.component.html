<h2>🎫 Ticket List</h2>

<!-- 🔍 FILTERS -->
<div class="filters">
  <input
    type="text"
    placeholder="Search tickets..."
    [(ngModel)]="searchText"
    (input)="applyFilter()"
  />

  <select [(ngModel)]="selectedStatus" (change)="applyFilter()">
    <option value="ALL">All</option>
    <option value="OPEN">OPEN</option>
    <option value="IN_PROGRESS">IN_PROGRESS</option>
    <option value="RESOLVED">RESOLVED</option>
    <option value="CLOSED">CLOSED</option>
  </select>
</div>

<!-- ➕ CREATE BUTTON -->
<button *ngIf="isAdmin() || isUser()" (click)="toggleForm()">
  ➕ Create Ticket
</button>

<!-- 📝 CREATE FORM -->
<div *ngIf="showForm" class="form-box">
  <h3>Create Ticket</h3>

  <input type="text" placeholder="Title" [(ngModel)]="newTicket.title" />

  <textarea
    placeholder="Description"
    [(ngModel)]="newTicket.description"
  ></textarea>

  <div class="form-actions">
    <button (click)="createTicket()">Submit</button>
    <button (click)="toggleForm()">Cancel</button>
  </div>
</div>

<!-- 📊 TABLE -->
<table class="ticket-table">
  <thead>
    <tr>
      <th>ID</th>
      <th>Title</th>
      <th>Status</th>
      <th>Assigned To</th>
      <th>Created By</th>
      <th>Action</th>
    </tr>
  </thead>

  <tbody>
    <tr *ngFor="let ticket of filteredTickets">
      <td>{{ ticket.id }}</td>
      <td>{{ ticket.title }}</td>

      <!-- 🔄 STATUS DROPDOWN -->
      <td *ngIf="isAdmin() || isAgent(); else statusText">
        <select
          [value]="ticket.status"
          (change)="updateStatus(ticket.id, $event)"
        >
          <option value="OPEN">OPEN</option>
          <option value="IN_PROGRESS">IN_PROGRESS</option>
          <option value="RESOLVED">RESOLVED</option>
          <option value="CLOSED">CLOSED</option>
        </select>
      </td>

      <ng-template #statusText>
        <td>{{ ticket.status }}</td>
      </ng-template>
      <td *ngIf="isAdmin(); else assignedText">
        <select
          [(ngModel)]="ticket.assignedTo"
          (ngModelChange)="assignUser(ticket.id, $event)"
        >
          <option [ngValue]="null">Unassigned</option>
          <option *ngFor="let user of users" [ngValue]="user.id">
            {{ user.name }}
          </option>
        </select>
      </td>

      <ng-template #assignedText>
        <td>{{ ticket.assignedTo }}</td>
      </ng-template>

      <td>{{ ticket.createdBy?.name }}</td>

     <td>
  <button (click)="view(ticket.id)">View</button>

  <button *ngIf="isAdmin()" (click)="startEdit(ticket)">
    Edit
  </button>

  <button *ngIf="isAdmin()" (click)="deleteTicket(ticket.id)">
    Delete
  </button>
</td>
    </tr>
  </tbody>
</table>

<!-- ✏️ EDIT FORM -->
<div *ngIf="editingTicket" class="form-box">
  <h3>Edit Ticket</h3>

  <input type="text" [(ngModel)]="editingTicket.title" />

  <textarea [(ngModel)]="editingTicket.description"></textarea>

  <div class="form-actions">
    <button (click)="updateTicket()">Update</button>
    <button (click)="cancelEdit()">Cancel</button>
  </div>
</div>
